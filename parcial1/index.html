<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavandería Burbujas</title>
</head>
<body>
    <header><h1>Lavandería Burbujas</h1>
    
    </header>
    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#lavados">Nuestros Lavados</a>
        <a href="#contacto">Contacto</a>
    </nav>

    <main>
        <section id="lavados">
            <h2>Nuestros Lavados</h2>
            <p>Cuidamos tu ropa con la mejor calidad del mercado.</p>
            <ul>
                <li>Lavado por kilo - Bs. 15</li>
                <li>Planchado por prenda - Bs. 8</li>
                <li>Lavado de frazadas - Bs. 35</li>
            </ul>
        </section>
        <section id="contacto">
            <h2>Deja tu encargo</h2>
            <form>
                <div>
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" required>
                </div>
                <div>
                    <label for="correo">Correo electronico:</label>
                    <input type="email" id="correo" required>
                </div>
                <div>
                    <label for="encargo">Tu encargo:</label>
                    <textarea id="encargo"></textarea>
                </div>
            </form>

            <button type="button" id="btn-confirmar">Confirmar encargo</button>
            <p id="mensaje" class="oculto"></p>
        </section>
    </main>
    
</body>
</html>
