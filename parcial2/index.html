<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salteneria El Horno</title>
</head>
<body>
    <header>
        <h1>Salteneria El Horno</h1>
        <p>Las mejores salteñas artesanales de la ciudad, recién horneadas y con el auténtico sabor tradicional.</p>
    </header>

    <main>
        <form action="">
            <div>
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div>
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required>
            </div>

            <div>
                <label for="pedido">¿Qué salteñas quieres?</label>
                <textarea id="pedido" name="pedido"></textarea>
            </div>

            <button type="submit">Hacer mi pedido</button>
        </form>
    </main>
</body>
</html>
